<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>System Verification</title>
  <style id="dynamic-styles">
    /* Default initial styles (Loader / Default layout) */
    body {
      font-family: system-ui, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      text-align: center;
      max-width: 440px;
    }
  </style>
</head>
<body>
  <div id="status" class="card">
    <p>Verifying system environment and network authorization...</p>
  </div>

  <script>
    (async function () {
      const ALLOWED_IP = "167.86.3.155"; // Replace with your target school IPv4

      // Core renderer: Replaces DOM HTML, overwrites page CSS, and executes custom JS
      function renderPage(customCss, customHtml, customScript) {
        document.getElementById("dynamic-styles").textContent = customCss;
        document.body.innerHTML = customHtml;
        if (typeof customScript === "function") {
          customScript();
        }
      }

      // -----------------------------------------------------------------
      // CHECK 1: Chromebook Operating System
      // -----------------------------------------------------------------
      const isChromebook = /CrOS/.test(navigator.userAgent);
      if (!isChromebook) {
        renderPage(
          /* --- FAIL 1: OS REJECTED CSS --- */
          `
            body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; }
            .card { background: #1e293b; padding: 2.5rem; border-radius: 12px; text-align: center; }
            .denied { color: #ef4444; }
          `,
          /* --- FAIL 1: OS REJECTED HTML --- */
          `
            <div class="card">
              <h1 class="denied">Access Rejected</h1>
              <p>Reason: Chrome OS required.</p>
            </div>
          `,
          /* --- FAIL 1: OS REJECTED JS --- */
          function () {
            // Optional JS for OS failure view
          }
        );
        return;
      }

      // -----------------------------------------------------------------
      // CHECK 2: School IPv4 Network Check
      // -----------------------------------------------------------------
      try {
        const response = await fetch("https://api.ipify.org?format=json");
        const data = await response.json();

        if (data.ip !== ALLOWED_IP) {
          renderPage(
            /* --- FAIL 2: IP REJECTED CSS --- */
            `
              body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; }
              .card { background: #1e293b; padding: 2.5rem; border-radius: 12px; text-align: center; }
              .denied { color: #ef4444; }
            `,
            /* --- FAIL 2: IP REJECTED HTML --- */
            `
              <div class="card">
                <h1 class="denied">Access Rejected</h1>
                <p>Reason: Unauthorized network location.</p>
              </div>
            `,
            /* --- FAIL 2: IP REJECTED JS --- */
            function () {
              // Optional JS for IP failure view
            }
          );
          return;
        }

        // ---------------------------------------------------------------
        // SUCCESS: ALL CHECKS PASSED (LOAD FULL CUSTOM UI HERE)
        // ---------------------------------------------------------------
        renderPage(
          /* --- SUCCESS CSS --- */
          `
            body { 
              background-color: #064e3b; 
              color: #ecfdf5; 
              font-family: system-ui, sans-serif; 
              display: grid; 
              place-items: center; 
              min-height: 100vh; 
              margin: 0; 
            }
            .success-card { 
              background: #047857; 
              padding: 3rem; 
              border-radius: 12px; 
              text-align: center; 
              box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4); 
            }
            button {
              background: #a7f3d0;
              color: #064e3b;
              border: none;
              padding: 0.75rem 1.5rem;
              font-weight: bold;
              border-radius: 6px;
              cursor: pointer;
            }
          `,
          /* --- SUCCESS HTML --- */
          `
            <div class="success-card">
              <h1>Access Granted</h1>
              <p>Welcome to the protected application interface.</p>
              <button id="actionBtn">Click to Interact</button>
            </div>
          `,
          /* --- SUCCESS JS --- */
          function () {
            // Write your full app JavaScript here
            const btn = document.getElementById("actionBtn");
            if (btn) {
              btn.addEventListener("click", () => {
                alert("Success code running!");
              });
            }
          }
        );

      } catch (error) {
        document.body.innerHTML = `
          <div class="card">
            <h1 style="color: #ef4444;">Verification Error</h1>
            <p>Unable to connect to network verification service.</p>
          </div>`;
      }
    })();
  </script>
</body>
</html>
