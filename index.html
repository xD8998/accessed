<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>System Verification</title>
  <style id="dynamic-styles">
    /* Default initial styles (Loader / Default layout) */
    body {
      font-family: system-ui, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      text-align: center;
      max-width: 440px;
    }
  </style>
</head>
<body>
  <div id="status" class="card">
    <p>Verifying system environment and network authorization...</p>
  </div>

  <script>
    (async function () {
      const ALLOWED_IP = "167.86.3.155"; // Replace with your target school IPv4

      // Core renderer: Replaces DOM HTML, overwrites page CSS, and executes custom JS
      function renderPage(customCss, customHtml, customScript) {
        document.getElementById("dynamic-styles").textContent = customCss;
        document.body.innerHTML = customHtml;
        if (typeof customScript === "function") {
          customScript();
        }
      }

      // -----------------------------------------------------------------
      // CHECK 1: Chromebook Operating System
      // -----------------------------------------------------------------
      const isChromebook = /CrOS/.test(navigator.userAgent);
      if (!isChromebook) {
        renderPage(
          /* --- FAIL 1: OS REJECTED CSS --- */
          `
            body {
              background: #0f172a url("https://t4.ftcdn.net/jpg/02/43/23/77/360_F_243237730_rA3o8krDwrWFWGthv5ffnp17cqKaxwZe.jpg") no-repeat center center fixed;
              background-size: cover;
              color: #f8fafc;
              font-family: system-ui, -apple-system, sans-serif;
              font-weight: 300;
              display: flex;
              justify-content: center;
              align-items: center;
              min-height: 100vh;
              margin: 0;
              padding: 1.25rem;
              box-sizing: border-box;
            }

            .glass-card {
              background: rgba(15, 23, 42, 0.85);
              backdrop-filter: blur(18px);
              -webkit-backdrop-filter: blur(18px);
              border: 1px solid rgba(255, 255, 255, 0.18);
              border-radius: 24px;
              padding: 2rem 1.5rem;
              text-align: center;
              width: 100%;
              max-width: 400px;
              box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
              box-sizing: border-box;
            }

            .denied {
              color: #f87171;
              font-weight: 400;
              font-size: 1.6rem;
              margin: 0 0 0.25rem 0;
              letter-spacing: -0.5px;
            }

            .reason {
              font-size: 1.05rem;
              color: #e2e8f0;
              font-weight: 300;
              margin: 0 0 1.25rem 0;
            }

            .clarify {
              font-size: 0.9rem;
              color: #cbd5e1;
              font-weight: 300;
              line-height: 1.4;
              margin-bottom: 0.5rem;
            }

            .url-display {
              font-family: monospace;
              font-size: 1.05rem;
              font-weight: 600;
              color: #38bdf8;
              background: rgba(0, 0, 0, 0.4);
              padding: 0.75rem;
              border-radius: 12px;
              border: 1px solid rgba(255, 255, 255, 0.12);
              word-break: break-all;
              margin: 0.75rem 0 0.5rem 0;
            }

            .arrow-container {
              margin: 0.5rem 0;
              animation: bounce 2s infinite;
            }

            .arrow {
              font-size: 1.5rem;
              color: #38bdf8;
              display: inline-block;
            }

            .device-img {
              width: 120px;
              height: auto;
              border-radius: 10px;
              margin-top: 0.25rem;
              filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
            }

            @keyframes bounce {
              0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
              40% { transform: translateY(-6px); }
              60% { transform: translateY(-3px); }
            }
          `,
          /* --- FAIL 1: OS REJECTED HTML --- */
          `
            <div class="glass-card">
              <h1 class="denied">Access Rejected</h1>
              <p class="reason">Reason: Chrome OS required.</p>
              
              <p class="clarify">If you scanned this from a phone, please open a <strong>Chromebook</strong> and navigate to this URL:</p>
              
              <div id="target-url" class="url-display">Fetching URL...</div>
              
              <div class="arrow-container">
                <span class="arrow">↓</span>
              </div>

              <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS7g8T70YNj6SQQmuxpLIBlxiXmOAkt9XIMRmOqX1-WFP7ADMEFfur0fws&s=10" alt="Chromebook Required" class="device-img" />
            </div>
          `,
          /* --- FAIL 1: OS REJECTED JS --- */
          function () {
            const urlBox = document.getElementById("target-url");
            if (urlBox) {
              urlBox.textContent = window.location.href;
            }
          }
        );
        return;
      }

      // -----------------------------------------------------------------
      // CHECK 2: School IPv4 Network Check
      // -----------------------------------------------------------------
      try {
        const response = await fetch("https://api.ipify.org?format=json");
        const data = await response.json();

        if (data.ip !== ALLOWED_IP) {
          renderPage(
            /* --- FAIL 2: IP REJECTED CSS --- */
            `
              body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; }
              .card { background: #1e293b; padding: 2.5rem; border-radius: 12px; text-align: center; }
              .denied { color: #ef4444; }
            `,
            /* --- FAIL 2: IP REJECTED HTML --- */
            `
              <div class="card">
                <h1 class="denied">Access Rejected</h1>
                <p>Reason: Unauthorized network location.</p>
              </div>
            `,
            /* --- FAIL 2: IP REJECTED JS --- */
            function () {
              // Optional JS for IP failure view
            }
          );
          return;
        }

        // ---------------------------------------------------------------
        // SUCCESS: ALL CHECKS PASSED (LOAD FULL CUSTOM UI HERE)
        // ---------------------------------------------------------------
        renderPage(
          /* --- SUCCESS CSS --- */
          `
            body { 
              background-color: #064e3b; 
              color: #ecfdf5; 
              font-family: system-ui, sans-serif; 
              display: grid; 
              place-items: center; 
              min-height: 100vh; 
              margin: 0; 
            }
            .success-card { 
              background: #047857; 
              padding: 3rem; 
              border-radius: 12px; 
              text-align: center; 
              box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4); 
            }
            button {
              background: #a7f3d0;
              color: #064e3b;
              border: none;
              padding: 0.75rem 1.5rem;
              font-weight: bold;
              border-radius: 6px;
              cursor: pointer;
            }
          `,
          /* --- SUCCESS HTML --- */
          `
            <div class="success-card">
              <h1>Access Granted</h1>
              <p>Welcome to the protected application interface.</p>
              <button id="actionBtn">Click to Interact</button>
            </div>
          `,
          /* --- SUCCESS JS --- */
          function () {
            // Write your full app JavaScript here
            const btn = document.getElementById("actionBtn");
            if (btn) {
              btn.addEventListener("click", () => {
                alert("Success code running!");
              });
            }
          }
        );

      } catch (error) {
        document.body.innerHTML = `
          <div class="card">
            <h1 style="color: #ef4444;">Verification Error</h1>
            <p>Unable to connect to network verification service.</p>
          </div>`;
      }
    })();
  </script>
</body>
</html>
